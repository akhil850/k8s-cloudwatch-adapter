name: Docker build and publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a candidate image to GHCR
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/akhil850/k8s-cloudwatch-adapter
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test image publication policy
        run: python3 -m unittest discover -s hack/tests -v
      - name: Detect build-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 hack/ci_images.py changes

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Run package tests and race detector
        run: go test -race ./pkg/... ./cmd/...

  build:
    needs: [changes, test]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    # Serialize tag writers. Never cancel a publication midway.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('image-pr-{0}', github.event.pull_request.number) || 'image-publication' }}
      cancel-in-progress: false
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log into GHCR
        if: env.PUBLISH == 'true'
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
      - name: Reuse an existing commit image
        id: candidate
        run: python3 hack/ci_images.py prepare
      - name: Build multi-architecture image
        id: build
        if: steps.candidate.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.candidate.outputs.tag }}
          cache-from: type=gha,scope=adapter
          cache-to: type=gha,scope=adapter,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image digest and update latest when eligible
        if: env.PUBLISH == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest || steps.build.outputs.digest }}
        run: python3 hack/ci_images.py record
      - name: Save candidate metadata
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-metadata
          path: image-metadata.json
          if-no-files-found: error
      - name: Log out of GHCR
        if: always() && env.PUBLISH == 'true'
        run: docker logout ghcr.io

  ci:
    name: CI
    if: always()
    needs: [changes, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$CHANGES" = success
          if [ "$RELEVANT" = true ]; then
            test "$TEST" = success
            test "$BUILD" = success
          fi
