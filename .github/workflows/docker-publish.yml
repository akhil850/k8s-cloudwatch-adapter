name: Docker build and publish

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish image to GitHub Container Registry'
        type: boolean
        default: true
      update_latest:
        description: 'Also update :latest tag'
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/akhil850/k8s-cloudwatch-adapter

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Run package tests and race detector
        run: go test -race ./pkg/...

  build:
    needs: test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Determine publish mode
        id: prep
        run: |
          PUBLISH="false"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            PUBLISH="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            PUBLISH="true"
          fi
          echo "publish=${PUBLISH}" >> $GITHUB_OUTPUT

      - name: Log into GitHub Container Registry
        if: steps.prep.outputs.publish == 'true'
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build and optionally publish multi-arch images
        env:
          PUBLISH: ${{ steps.prep.outputs.publish }}
          UPDATE_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.update_latest }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          tags=(--tag "${IMAGE_NAME}:${SHORT_SHA}" --tag "${IMAGE_NAME}:${GITHUB_SHA}")

          # If pushed to master, also tag :master
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            tags+=(--tag "${IMAGE_NAME}:master")
          fi

          # If release tag (e.g. v0.1.0 or v0.1.0-rc1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(--tag "${IMAGE_NAME}:${GITHUB_REF_NAME}")
            # If not a pre-release (doesn't contain a hyphen like -rc), update :latest
            if [[ "$GITHUB_REF_NAME" != *-* ]]; then
              tags+=(--tag "${IMAGE_NAME}:latest")
            fi
          fi

          # Manual dispatch override to force update latest
          if [[ "$PUBLISH" == "true" && "$UPDATE_LATEST" == "true" ]]; then
            tags+=(--tag "${IMAGE_NAME}:latest")
          fi

          output=(--output type=cacheonly)
          if [[ "$PUBLISH" == "true" ]]; then
            output=(--push)
          fi

          docker buildx build --platform linux/amd64,linux/arm64 \
            --file Dockerfile "${tags[@]}" "${output[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .

      - name: Log out of GitHub Container Registry
        if: always() && steps.prep.outputs.publish == 'true'
        run: docker logout ghcr.io
