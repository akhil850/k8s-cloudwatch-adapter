name: Docker build and publish

on:
  push:
    branches: [master, adapter-fixes]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the commit image to Docker Hub
        type: boolean
        default: false
      update_latest:
        description: Also update latest (requires publish)
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/akhil850/k8s-cloudwatch-adapter

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build Docker image
        run: docker build --file Dockerfile --tag "${IMAGE_NAME}:${GITHUB_SHA}" .
      - name: Log into Docker Hub
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish image
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          UPDATE_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.update_latest }}
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          if [[ "$UPDATE_LATEST" == true ]]; then
            docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          fi
      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io
