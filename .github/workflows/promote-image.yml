name: Promote validated image

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Docker build and publish run ID
        required: true
        type: string
      digest:
        description: Multi-architecture sha256 digest tested in EKS
        required: true
        type: string
      version:
        description: Image version, such as v1.0.0 or v1.0.0-rc.1
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/akhil850/k8s-cloudwatch-adapter
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: image-publication
      cancel-in-progress: false
    steps:
      - name: Require master workflow
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log into GHCR
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
      - name: Verify candidate and promote without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          IMAGE_DIGEST: ${{ inputs.digest }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 hack/ci_images.py promote
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
